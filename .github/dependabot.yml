version: 2
# GitHub Packages uses Dependabot's automatic token and the package Read grants.
# Keep credentials out of this file and the repository's registry-only .npmrc.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # openapi-typescript 7.x pins its peer to typescript ^5.x, so a group bump of
    # typescript to 7 makes `npm ci` fail with ERESOLVE before the build ever runs.
    # Keep it out of the groups until openapi-typescript supports TS 7.
    ignore:
      - dependency-name: "typescript"
    groups:
      all-dependencies:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-dependencies:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
