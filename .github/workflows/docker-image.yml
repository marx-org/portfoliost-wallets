name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@52789453b62fae888e467d529b467f443c09490d
    with:
      node_version: '22'
      test_command: npm ci && npm run build && npm run test
    secrets: inherit
    permissions:
      contents: write
      packages: write
