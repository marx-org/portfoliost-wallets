name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@fbdef004eedaea7eca60573365396b34f41b4513
    with:
      node_version: '22'
      test_command: node --test scripts/npm-auth.check.mjs && npm ci && npm run build && npm run test
    secrets: inherit
    permissions:
      contents: write
      packages: write
