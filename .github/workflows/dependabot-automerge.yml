name: Dependabot automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  dependabot:
    uses: marx-org/pfire-workflows/.github/workflows/dependabot-automerge.yml@f06ee147e41e051c4a6a108e81823073ec57e350
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      checks: read
