name: Dependabot automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  dependabot:
    uses: marx-org/pfire-workflows/.github/workflows/dependabot-automerge.yml@fbdef004eedaea7eca60573365396b34f41b4513
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      checks: read
